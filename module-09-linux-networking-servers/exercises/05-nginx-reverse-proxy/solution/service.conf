# Exercise 05 -- reference solution.
#
# Install with:
#   sudo cp service.conf /etc/nginx/sites-available/exercise05
#   sudo ln -s /etc/nginx/sites-available/exercise05 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# (Remove/disable any other enabled site listening on port 80 first, or
# this will conflict with it the same way lessons/06's "gotchas" section
# describes.)

server {
    listen 80;
    server_name _;

    # The trailing "/" after the port here is what makes this the
    # STRIPPING form of proxy_pass -- the opposite of QuestLog's own
    # config in lessons/06-nginx-and-reverse-proxies.md, which
    # deliberately had no trailing path at all. Because this location
    # block matches the prefix "/service/" and proxy_pass here ends in
    # "/" (an explicit, even if empty, URI part), Nginx replaces the
    # matched "/service/" prefix with that trailing "/" before
    # forwarding -- so "/service/hello" arrives at the backend as
    # "/hello", and "/service/quests/42" arrives as "/quests/42".
    location /service/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Explicit, deterministic 404 for everything else -- `return 404;`
    # sends the status immediately, no proxying, no dependency on any
    # inherited default `root`.
    location / {
        return 404;
    }
}
