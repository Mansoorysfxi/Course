name: Deploy course website

# Builds the course with MkDocs (see build_docs.sh for why it copies the
# repo into an ephemeral .docs_src/ before building) and publishes it to
# GitHub Pages. Requires one one-time manual step in the repo's Settings ->
# Pages -> "Build and deployment" -> Source: "GitHub Actions" (not
# "Deploy from a branch") -- see the repo README for details.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight run finish rather
# than cancelling it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs and plugins
        run: pip install -r requirements-docs.txt

      - name: Build site
        run: bash build_docs.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
