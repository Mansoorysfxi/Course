# QuestLog -- Nginx site config (reference copy)
#
# Like questlog-backend.service, this is a REFERENCE COPY kept in
# version control next to the app it configures -- the real deploy step
# (lessons/08-deploying-questlog-part2-frontend-and-going-live.md) copies
# this exact file to /etc/nginx/sites-available/questlog on the server,
# symlinks it into sites-enabled/, removes Ubuntu's default site, and
# runs `sudo nginx -t` then `sudo systemctl reload nginx`.
#
# Every directive here is explained in full in
# lessons/06-nginx-and-reverse-proxies.md (the general reverse-proxy and
# static-file mechanism) -- this file is that lesson's own worked example,
# applied to QuestLog's real paths instead of a practice folder.
#
# Deliberately HTTP-only (port 80), no TLS -- this module does not add a
# real domain name or an HTTPS certificate. That's Module 11's job, once
# a real domain and a CI/CD pipeline both exist. Leaving this server on
# plain HTTP is a known, stated, deliberate limitation of this module's
# scope, not an oversight -- see this file's own module's Lesson 08.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Built React frontend (frontend/dist/, copied here during deploy --
    # see Lesson 08's "building and shipping the frontend" section).
    root /var/www/questlog;
    index index.html;

    # Every QuestLog API route is defined starting with /api/ (see
    # backend/app/main.py's router prefixes) -- this block only matches
    # those, and forwards them, path unchanged, to the backend's Uvicorn
    # process, listening privately on 127.0.0.1:8000 (never exposed
    # directly -- see lessons/04-networking-ports-and-ips.md and
    # lessons/05-firewalls-with-ufw.md for why 8000 has no ufw rule at all).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: try to serve a real static file from `root`
    # first (index.html itself, or a hashed JS/CSS bundle under
    # /assets/); if no such file exists, fall back to index.html so
    # React Router's client-side routes (e.g. a direct visit or refresh
    # on /quests/42) resolve correctly instead of a raw Nginx 404. See
    # lessons/06-nginx-and-reverse-proxies.md's "why SPA routing needs
    # try_files" section for the full explanation.
    location / {
        try_files $uri /index.html;
    }
}
