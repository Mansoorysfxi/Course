# QuestLog frontend -- Nginx config used INSIDE the frontend container.
#
# Deliberately almost identical to
# module-09-linux-networking-servers/project/questlog/deploy/nginx/questlog.conf
# -- see lessons/08-containerizing-questlogs-frontend-and-full-compose.md
# for a line-by-line comparison of the two. The only real difference is
# `proxy_pass`'s target: Module 09's version pointed at
# `http://127.0.0.1:8000` because Nginx and the backend both ran as
# processes on the SAME physical machine, sharing one `localhost`. Here,
# Nginx and the backend are two separate CONTAINERS, each with their own
# private network namespace and their own, private `localhost` that the
# other one cannot see at all -- so `127.0.0.1:8000` from inside this
# container would mean "port 8000 on this very Nginx container," which
# has nothing listening there, not "the backend container." Instead,
# this file targets `http://backend:8000` -- `backend` is not a
# placeholder, it is a real, resolvable hostname, automatically created
# by Docker Compose's own built-in DNS server for every service defined
# in docker-compose.yml, resolving to that service's container on the
# shared network Compose creates for this whole application. See
# lessons/04-docker-networking.md for exactly how and why this works.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
